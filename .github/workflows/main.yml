name: Bor Economic Auto Publisher

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish daily economic article
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          PUBLISH_START_DATE: ${{ vars.PUBLISH_START_DATE }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const posts = JSON.parse(
              fs.readFileSync("posts.json", "utf8")
            );

            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Africa/Algiers",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).formatToParts(new Date());

            const dateParts = Object.fromEntries(
              parts.map(p => [p.type, p.value])
            );

            const today =
              `${dateParts.year}-${dateParts.month}-${dateParts.day}`;

            const startDate = process.env.PUBLISH_START_DATE;

            if (!startDate || !/^\d{4}-\d{2}-\d{2}$/.test(startDate)) {
              throw new Error(
                "Configure PUBLISH_START_DATE in GitHub Variables."
              );
            }

            const start = Date.parse(startDate + "T12:00:00Z");
            const current = Date.parse(today + "T12:00:00Z");

            const days = Math.floor(
              (current - start) / 86400000
            );

            if (days < 0) {
              throw new Error("The start date is in the future.");
            }

            const index = days % posts.length;
            const post = posts[index];

            console.log("Date:", today);
            console.log("Article:", index + 1, "/", posts.length);
            console.log("Title:", post.title);

            if (process.env.DRY_RUN === "true") {
              console.log("TEST ONLY: Nothing was published.");
              return;
            }

            const pageId = process.env.FACEBOOK_PAGE_ID;
            const token = process.env.FACEBOOK_PAGE_ACCESS_TOKEN;

            if (!pageId || !token) {
              throw new Error(
                "Facebook credentials are not configured."
              );
            }

            const response = await fetch(
              `https://graph.facebook.com/v24.0/${encodeURIComponent(pageId)}/feed`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                  message: post.message,
                  access_token: token
                })
              }
            );

            const result = await response.json();

            if (!response.ok || result.error) {
              throw new Error(
                result.error?.message || "Facebook publishing failed."
              );
            }

            console.log("Published successfully:", result.id);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
